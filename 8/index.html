<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        a {
            display: block;
            padding: 12px 20px;
            margin: 10px 0;
            background-color: white;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border-left: 4px solid #4CAF50;
        }
        a:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: #f9f9f9;
            border-left-color: #45a049;
        }
    </style>
</head>
<body>
    <a href="table.html">табличная верстка</a>
    <a href="block.html">блочная верстка</a>
    <a href="semant.html">семантическая верстка</a>
</body>
</html>
