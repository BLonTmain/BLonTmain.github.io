<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div id="content">
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page') || 'video';
        
        let content = '';
        
        if (page === 'video') {
            content = 
                <h2>Видео</h2>
                <video width="320" height="240" controls>
                    <source src="https://video-preview.s3.yandex.net/An6cXAIAAAA.mp4" type="video/mp4">
                    Ваш браузер не поддерживает видео.
                </video>
                <br><br>
                <a href="info.html?page=audio" target="_self">Аудио</a> | 
                <a href="info.html?page=gallery" target="_self">Фото и GIF</a>
            ;
        } 
        else if (page === 'audio') {
            content = 
                <h2>Аудио</h2>
                <audio controls>
                    <source src="https://androiddevhub.com/play.php?token=9db303dc3062a7e5" type="audio/mpeg">
                    Ваш браузер не поддерживает аудио.
                </audio>
                <br><br>
                <a href="info.html?page=video" target="_self">Видео</a> | 
                <a href="info.html?page=gallery" target="_self">Фото и GIF</a>
            ;
        } 
        else if (page === 'gallery') {
            content = 
                <h2>Фото и GIF</h2>
                <p>JPG:</p>
                <img src="https://i.pinimg.com/originals/55/70/02/55700266b0431eaea7009206af75a1d5.jpg" width="200">
                <p>PNG:</p>
                <img src="https://i.pinimg.com/736x/ee/8b/b9/ee8bb944a6283d7b4caa1b140ed2e232.jpg" width="200">
                <p>GIF:</p>
                <img src="https://media1.tenor.com/m/wTcNb4Ug1z4AAAAC/ishowspeed-rko.gif" width="200">
                <br><br>
                <a href="info.html?page=video" target="_self">Видео</a> | 
                <a href="info.html?page=audio" target="_self">Аудио</a>
            ;
        }
        
        document.getElementById('content').innerHTML = content;
    </script>
</body>
</html>
