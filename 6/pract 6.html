<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .frameset {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .frame-left {
            width: 250px;
            height: 100%;
            border-right: 2px solid #ccc;
            box-sizing: border-box;
        }
        .frame-right {
            flex: 1;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="frameset">
        <div class="frame-left">
            <iframe src="menu.html" name="menuFrame" title="Навигационное меню"></iframe>
        </div>
        <div class="frame-right">
            <iframe src="info.html" name="infoFrame" title="Информационный фрейм"></iframe>
        </div>
    </div>
</body>
</html>
