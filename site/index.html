<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0b16;
      color: #d9d0e6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }

    :root {
      --primary: #5d3a7a;
      --primary-dark: #2d1a3a;
      --primary-light: #8a6aa8;
      --bg-card: #1a1424;
      --bg-sidebar: #231d2f;
      --text-light: #f0eaff;
      --text-dim: #b5a6c9;
      --border-color: #3a2a4a;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 700;
      color: #c9b6e6;
      text-align: center;
      margin-bottom: 3rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 1rem;
      font-family: 'Times New Roman', serif;
    }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-bottom: 3rem;
    }
    
    .category-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 2.5rem 1.5rem;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    .category-card:hover {
      background: #231d30;
      border-color: var(--primary-light);
      transform: translateY(-5px);
    }

    .category-icon {
      font-size: 4rem;
      color: var(--primary-light);
      margin-bottom: 1.5rem;
      opacity: 0.8;
    }

    .category-title {
      font-size: 2rem;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    .category-sub {
      color: var(--text-dim);
      margin-top: 1rem;
      font-size: 1rem;
      text-transform: lowercase;
      letter-spacing: 1px;
    }

    .bottom-panel {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    }

    .quick-links {
      display: flex;
      gap: 2.5rem;
    }

    .quick-links a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
      border-bottom: 1px solid transparent;
      padding-bottom: 3px;
    }

    .quick-links a:hover {
      color: var(--text-light);
      border-bottom-color: var(--primary-light);
    }

    .user-cabinet {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .cabinet-link {
      background: var(--primary);
      color: white;
      padding: 0.7rem 2rem;
      text-decoration: none;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9rem;
      transition: all 0.3s;
      border: 1px solid var(--primary-dark);
    }

    .cabinet-link:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    @media (max-width: 768px) {
      .logo { font-size: 2.5rem; }
      .main-grid { grid-template-columns: 1fr; }
      .bottom-panel { flex-direction: column; gap: 1.5rem; }
      .quick-links { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">ЛОГОТИП</div>
    
    <div class="main-grid">
      <div class="category-card" onclick="location.href='killers.html'">
        <i class="fas fa-skull category-icon"></i>
        <div class="category-title">убийцы</div>
        <div class="category-sub">гайды • аддоны • тир-лист</div>
      </div>
      <div class="category-card" onclick="location.href='perks.html'">
        <i class="fas fa-scroll category-icon"></i>
        <div class="category-title">перки</div>
        <div class="category-sub">гайды • сборки • калькулятор</div>
      </div>
      <div class="category-card" onclick="location.href='survivors.html'">
        <i class="fas fa-users category-icon"></i>
        <div class="category-title">выжившие</div>
        <div class="category-sub">общий гайд • предметы • аддоны</div>
      </div>
    </div>

    <div class="bottom-panel">
      <div class="quick-links">
        <a href="#">гайды</a>
        <a href="#">аддоны</a>
        <a href="#">тир-лист</a>
      </div>
      <div class="user-cabinet">
        <a href="cabinet.html" class="cabinet-link">Личный кабинет</a>
      </div>
    </div>
  </div>
</body>
</html>
