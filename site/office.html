<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0b16;
      color: #d9d0e6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
      --primary: #5d3a7a;
      --primary-dark: #2d1a3a;
      --primary-light: #8a6aa8;
      --bg-card: #1a1424;
      --bg-sidebar: #231d2f;
      --text-light: #f0eaff;
      --text-dim: #b5a6c9;
      --border-color: #3a2a4a;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 700;
      color: #c9b6e6;
      text-align: center;
      margin-bottom: 3rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 1rem;
      font-family: 'Times New Roman', serif;
    }

    .cabinet-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 2rem;
    }

    .profile-card {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      padding: 2rem;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-dark);
    }

    .avatar i {
      font-size: 5rem;
      color: var(--text-dim);
    }

    .username {
      font-size: 2.2rem;
      color: var(--text-light);
      margin-bottom: 1.5rem;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .profile-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .profile-btn {
      background: transparent;
      border: 1px solid var(--primary);
      padding: 0.8rem;
      color: var(--text-light);
      text-decoration: none;
      transition: all 0.3s;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9rem;
    }

    .profile-btn:hover {
      background: var(--primary);
      border-color: var(--primary-light);
    }

    .forms-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 2rem;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .tab {
      padding: 0.5rem 2rem;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9rem;
      color: var(--text-dim);
      border: 1px solid transparent;
    }

    .tab.active {
      color: var(--text-light);
      border: 1px solid var(--primary);
      background: rgba(93, 58, 122, 0.2);
    }

    .tab:not(.active):hover {
      color: var(--text-light);
      border-color: var(--border-color);
    }

    .form-container {
      display: none;
    }

    .form-container.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-dim);
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      color: var(--text-light);
      font-size: 1rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary-light);
    }

    .submit-btn {
      background: var(--primary);
      color: white;
      padding: 1rem 2rem;
      border: 1px solid var(--primary-dark);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }

    .submit-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .user-name-display {
      font-size: 2rem;
      color: var(--text-light);
      margin-bottom: 2rem;
      text-align: center;
    }

    @media (max-width: 768px) {
      .logo { font-size: 2.5rem; }
      .cabinet-grid { grid-template-columns: 1fr; }
      .tabs { flex-direction: column; }
      .tab { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">ЛОГОТИП</div>
    
    <div class="cabinet-grid">
      <div class="profile-card">
        <div class="avatar">
          <i class="fas fa-user"></i>
        </div>
        <div class="username">YOUR_NAME</div>
        <div class="profile-actions">
          <a href="#" class="profile-btn">Смена аватара</a>
          <a href="#" class="profile-btn">Смена никнейма</a>
        </div>
      </div>

      <div class="forms-card">
        <div class="tabs">
          <div class="tab active" onclick="showTab('login')">Вход</div>
          <div class="tab" onclick="showTab('register')">Регистрация</div>
        </div>

        <div id="login" class="form-container active">
          <form onsubmit="event.preventDefault(); alert('Вход выполнен (демо)');">
            <div class="form-group">
              <label>Логин или email</label>
              <input type="text" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Пароль</label>
              <input type="password" class="form-control" required>
            </div>
            <button type="submit" class="submit-btn">Войти</button>
          </form>
        </div>

        <div id="register" class="form-container">
          <form onsubmit="event.preventDefault(); alert('Регистрация выполнена (демо)');">
            <div class="form-group">
              <label>Имя пользователя</label>
              <input type="text" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Пароль</label>
              <input type="password" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Подтверждение пароля</label>
              <input type="password" class="form-control" required>
            </div>
            <button type="submit" class="submit-btn">Зарегистрироваться</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showTab(tabName) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));
      
      if (tabName === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('login').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('register').classList.add('active');
      }
    }
  </script>
</body>
</html>
